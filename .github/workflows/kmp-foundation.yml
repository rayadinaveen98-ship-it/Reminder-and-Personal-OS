name: Kotlin Multiplatform foundation
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sqlite-contract:
    name: Portable SQLite transactional contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test SQLite schema, recovery and outbox transactions
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  shared-jvm:
    name: Shared JVM compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: JVM tests and compilation
        run: gradle --no-daemon :shared:jvmTest :shared:compileKotlinJvm --stacktrace

  android-shared:
    name: Android KMP shared-code compilation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 using hosted runner tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Compile shared Android KMP target
        run: gradle --no-daemon :shared:compileAndroidMain --stacktrace
      - name: Build independent Android native preview
        run: gradle -p androidApp --no-daemon testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-reminder-quiet-precision-r3c-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

  ios-shared:
    name: iOS simulator shared-code compilation
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Print Xcode build environment
        run: xcodebuild -version
      - name: Compile native iOS simulator KMP shared target
        run: gradle --no-daemon :shared:compileKotlinIosSimulatorArm64 --stacktrace
      - name: Link Kotlin/Native iOS Simulator framework
        run: gradle --no-daemon :shared:linkDebugFrameworkIosSimulatorArm64 --stacktrace
      - name: Generate Xcode preview project
        run: |
          brew install xcodegen
          cd iosApp
          xcodegen generate
      - name: Build iOS simulator preview (not an IPA)
        run: |
          xcodebuild -project iosApp/ReminderOSPreview.xcodeproj \
            -scheme ReminderOSPreview \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 build
      - name: Run iOS reminder persistence XCTest on Simulator
        run: |
          set -euo pipefail
          SIM_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for runtime,values in devices.items() if "iOS" in runtime for d in values if d.get("isAvailable",True) and "iPhone" in d["name"]), ""))')"
          test -n "$SIM_ID" || { echo "No available iPhone simulator found"; exit 1; }
          xcodebuild -project iosApp/ReminderOSPreview.xcodeproj \
            -scheme ReminderOSPreview \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            -derivedDataPath iosApp/DerivedData \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 \
            -parallel-testing-enabled NO test
      - name: Upload iOS simulator XCTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-persistence-test-diagnostics
          path: iosApp/DerivedData/Logs/Test/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload iOS simulator preview
        uses: actions/upload-artifact@v4
        with:
          name: ios-reminders-persistent-alpha-simulator
          path: iosApp/DerivedData/Build/Products/Debug-iphonesimulator/ReminderOSPreview.app
          if-no-files-found: error
          retention-days: 7
