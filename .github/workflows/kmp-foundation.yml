name: Kotlin Multiplatform foundation
on:
  push:
    branches:
      - feature/kmp-platform-foundation
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-jvm:
    name: Shared JVM compile and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: JVM tests and compilation
        run: gradle --no-daemon :shared:jvmTest :shared:compileKotlinJvm --stacktrace

  android-shared:
    name: Android KMP shared-code compilation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK 36 using hosted runner tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Compile shared Android library target
        run: gradle --no-daemon :shared:compileAndroidMain --stacktrace

  ios-shared:
    name: iOS simulator shared-code compilation
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Print Xcode build environment
        run: xcodebuild -version
      - name: Compile native iOS simulator target (not an IPA)
        run: gradle --no-daemon :shared:compileKotlinIosSimulatorArm64 --stacktrace
