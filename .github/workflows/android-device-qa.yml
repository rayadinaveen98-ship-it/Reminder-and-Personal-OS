name: Android instrumented persistence QA

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-device-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-backup:
    name: Real Android SQLite backup/restore tests (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android backup and SQLite device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: gradle -p androidApp --no-daemon connectedDebugAndroidTest --stacktrace
      - name: Upload instrumentation test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-failure
          path: |
            androidApp/build/reports/androidTests/
            androidApp/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 7
