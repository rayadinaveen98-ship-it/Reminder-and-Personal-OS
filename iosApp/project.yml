name: ReminderOSPreview
options:
  bundleIdPrefix: dev.reminderos
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    CODE_SIGN_STYLE: Automatic
    PRODUCT_BUNDLE_IDENTIFIER: dev.reminderos.iosalpha
targets:
  ReminderOSPreview:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/ReminderCore.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reminderos.iosalpha
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        INFOPLIST_KEY_UIApplicationSupportsDocumentBrowser: NO
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - ReminderOSPreviewTests
  ReminderOSPreviewTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: ReminderOSPreview
      - framework: ../shared/build/bin/iosSimulatorArm64/debugFramework/ReminderCore.framework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.reminderos.iosalpha.tests
        GENERATE_INFOPLIST_FILE: YES
